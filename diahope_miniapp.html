<!DOCTYPE html>
<html lang="en">

:root {
  --purple: #32145c;
  --deep: #211039;
  --lavender: #eee6fa;

  --text: #30243d;

}

* { box-sizing: border-box; }

body {

  color: var(--text);
  line-height: 1.6;
}

  padding: 30px 20px 35px;
  text-align: center;
  border-radius: 0 0 28px 28px;
}

.logo {
  width: 70px;
  height: 70px;
  margin: auto auto 12px;
  border: 2px solid var(--gold);
  border-radius: 50%;

  font-size: 30px;
}

header p {

.slogan {
  color: var(--gold);

  font-weight: bold;
}

.language {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.language button {
  border: 1px solid #ffffff80;
  color: white;
  background: transparent;
  border-radius: 20px;
  padding: 8px 16px;
}

.language button.active {
  background: var(--gold);

}

}

.card .icon {
  font-size: 25px;
}

.card h3 {

.card p {
  font-size: 13px;

  margin: 0;
}

}

section h2 {
  color: var(--purple);
  margin-top: 0;
}
